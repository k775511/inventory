<style>
  :root{

  .topbar{ background:var(--navy-900); color:#eef1f8; display:flex; align-items:center; justify-content:space-between; gap:16px; padding:0 20px; flex-wrap:wrap; border-bottom:1px solid #0e1526; }

  .topbar-right{ display:flex; align-items:center; gap:14px; padding:10px 0; }
  .alert-pill{ display:flex; align-items:center; gap:6px; background:#2a2140; color:#ff8a8a; border:1px solid #4a3560; border-radius:99px; padding:6px 12px; font-size:12.5px; font-weight:600; }
  .topbar-right .divider{ width:1px; height:14px; background:#38415a; }

  .icon-btn:hover{ color:#fff; }

  .app-main{ min-height:640px; }
  .section-titlebar{ background:var(--blue-700); color:#fff; font-size:16px; font-weight:800; padding:16px 24px; letter-spacing:.01em; }
  .sub-nav{ display:flex; gap:2px; background:var(--card-bg); border-bottom:1px solid var(--border); padding:0 20px; overflow-x:auto; }
  .sub-item{ background:none; border:none; padding:13px 15px; font-size:13px; font-weight:600; color:var(--text-600); border-bottom:2px solid transparent; white-space:nowrap; }
  .sub-item:hover{ color:var(--text-900); }
  .sub-item.active{ color:var(--blue-700); border-bottom-color:var(--blue-700); }
  .sub-view{ padding:20px; display:flex; flex-direction:column; gap:18px; }

  .stub-view{ padding:80px 24px; text-align:center; color:var(--text-600); }
  .stub-view .stub-title{ font-size:15px; font-weight:700; color:var(--text-900); margin-bottom:6px; }
  .stub-view .stub-desc{ font-size:13px; }

  .toolbar{ background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:14px 16px; display:flex; align-items:flex-end; gap:16px; flex-wrap:wrap; }
  .toolbar-actions{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .field{ display:flex; flex-direction:column; gap:5px; }
  .field label{ font-size:11.5px; font-weight:700; color:var(--text-600); }
  .field .input-icon{ position:relative; }
  .field .input-icon svg{ position:absolute; left:9px; top:50%; transform:translateY(-50%); color:var(--text-400); }
  .field .input-icon input{ padding-left:30px; }
  input[type=text], input[type=date], input[type=number], select, textarea{
    border:1px solid var(--border-strong); border-radius:var(--radius-sm); padding:8px 10px; font-size:13px; color:var(--text-900); background:#fff; min-width:0;
  }
  input:focus, select:focus, textarea:focus{ outline:2px solid #9db8e6; outline-offset:0; border-color:var(--blue-600); }
  select{ appearance:none; -webkit-appearance:none; background-image:none; padding-right:26px; }
  .field.select-wrap{ position:relative; }
  .field.select-wrap svg{ position:absolute; right:8px; bottom:9px; color:var(--text-400); pointer-events:none; }
  .btn{ border-radius:var(--radius-sm); font-size:13px; font-weight:700; padding:8px 14px; border:1px solid transparent; display:inline-flex; align-items:center; gap:6px; white-space:nowrap; }
  .btn-primary{ background:var(--navy-800); color:#fff; }
  .btn-primary:hover{ background:var(--navy-900); }
  .btn-accent{ background:var(--blue-600); color:#fff; }
  .btn-accent:hover{ background:var(--blue-700); }
  .btn-outline{ background:#fff; color:var(--text-600); border-color:var(--border-strong); }
  .btn-outline:hover{ background:#f5f7fa; }
  .btn-ghost{ background:none; color:var(--text-600); }
  .btn-ghost:hover{ color:var(--text-900); }
  .btn-sm{ padding:5px 9px; font-size:12px; }
  .btn-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .btn[disabled]{ opacity:.45; cursor:not-allowed; }

  .pill-row{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill{ background:#fff; border:1px solid var(--border-strong); color:var(--text-600); font-size:12.5px; font-weight:700; padding:7px 14px; border-radius:99px; }
  .pill:hover{ border-color:var(--blue-500); color:var(--blue-700); }
  .pill.active{ background:var(--navy-800); border-color:var(--navy-800); color:#fff; }

  .stat-cards{ display:grid; grid-template-columns:repeat(4,1fr); gap:14px; }
  .stat-cards.cols-3{ grid-template-columns:repeat(3,1fr); }
  .stat-card{ background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); padding:16px 18px; display:flex; flex-direction:column; gap:8px; }
  .stat-card .stat-top{ display:flex; align-items:center; justify-content:space-between; }
  .stat-card .stat-label{ font-size:12.5px; font-weight:700; color:var(--text-600); }
  .stat-card .stat-icon{ width:30px; height:30px; border-radius:8px; display:flex; align-items:center; justify-content:center; background:var(--blue-100); color:var(--blue-700); }
  .stat-card.warn .stat-icon{ background:var(--low-bg); color:var(--low-text); }
  .stat-card .stat-value{ font-size:26px; font-weight:800; }
  .stat-card.warn .stat-value{ color:var(--low-text); }
  .stat-card .stat-sub{ font-size:12px; color:var(--text-400); }

  .grid-2{ display:grid; grid-template-columns:1.1fr 1.4fr; gap:14px; align-items:start; }
  .grid-3{ display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; align-items:start; }
  .panel{ background:var(--card-bg); border:1px solid var(--border); border-radius:var(--radius); overflow:hidden; }
  .panel-header{ display:flex; align-items:center; justify-content:space-between; padding:13px 16px; border-bottom:1px solid var(--border); gap:10px; flex-wrap:wrap; }
  .panel-header h3{ margin:0; font-size:13.5px; font-weight:800; }
  .panel-header .count{ font-size:12px; color:var(--low-text); font-weight:700; }
  .panel-body{ padding:6px 0; }
  .panel-body.pad{ padding:16px; }

  .alert-list{ list-style:none; margin:0; padding:0; }
  .alert-item{ display:flex; align-items:center; gap:10px; padding:10px 16px; border-bottom:1px solid var(--border); font-size:12.5px; }
  .alert-item:last-child{ border-bottom:none; }
  .alert-item svg{ color:var(--low-text); flex:none; }
  .alert-item .ai-name{ font-weight:700; color:var(--text-900); flex:1; min-width:0; }
  .alert-item .ai-cat{ color:var(--text-400); font-size:11.5px; }
  .alert-item .ai-qty{ color:var(--low-text); font-weight:700; white-space:nowrap; }

  .table-wrap{ overflow-x:auto; border:1px solid var(--border); border-radius:var(--radius); background:#fff; }
  table{ width:100%; border-collapse:collapse; font-size:12.6px; min-width:640px; }
  thead th{ text-align:left; background:var(--sub-bg); color:var(--text-600); font-weight:800; font-size:11.5px; padding:10px 12px; border-bottom:1px solid var(--border); white-space:nowrap; }
  tbody td{ padding:9px 12px; border-bottom:1px solid var(--border); color:var(--text-900); white-space:nowrap; vertical-align:middle; }
  tbody tr:last-child td{ border-bottom:none; }
  tbody tr:hover{ background:#f7f9fc; }
  td.num, th.num{ text-align:right; font-variant-numeric:tabular-nums; }
  td.ctr, th.ctr{ text-align:center; }
  td.wrap{ white-space:normal; }
  .row-actions{ display:flex; gap:6px; }
  .icon-only{ width:28px; height:28px; padding:0; justify-content:center; border-radius:6px; }

  .badge{ display:inline-flex; align-items:center; gap:4px; font-size:11.5px; font-weight:800; padding:3px 9px; border-radius:99px; white-space:nowrap; }
  .badge-ok{ background:var(--ok-bg); color:var(--ok-text); }
  .badge-low{ background:var(--low-bg); color:var(--low-text); }
  .badge-in{ background:var(--in-bg); color:var(--in-text); }
  .badge-out{ background:var(--out-bg); color:var(--out-text); }
  .badge-sub{ background:var(--sub-bg); color:var(--sub-text); }
  .badge-warn{ background:var(--warn-bg); color:var(--warn-text); }

  /* ---- 재고현황: 부족/임박/과재고 그룹 리스트 ---- */
  .stock-group{ display:flex; flex-direction:column; gap:10px; }
  .stock-group-head{ display:flex; align-items:center; gap:8px; font-size:14px; font-weight:800; color:var(--text-900); }
  .stock-dot{ width:8px; height:8px; border-radius:50%; flex:none; }
  .stock-dot.low{ background:var(--low-text); }
  .stock-dot.warn{ background:var(--warn-text); }
  .stock-dot.over{ background:var(--over-text); }
  .stock-dot.ok{ background:var(--ok-text); }
  .stock-group-count{ color:var(--text-400); font-weight:700; }
  .stock-info-ic{ color:var(--text-400); display:inline-flex; cursor:help; }
  .stock-list{ border:1px solid var(--border); border-radius:var(--radius); background:#fff; overflow:hidden; }
  .stock-row{ display:flex; align-items:center; justify-content:space-between; gap:18px; padding:13px 16px; border-bottom:1px solid var(--border); }
  .stock-row:last-child{ border-bottom:none; }
  .stock-row:hover{ background:#f7f9fc; }
  .stock-row-main{ min-width:0; }
  .stock-row-name{ font-size:13.5px; font-weight:800; color:var(--text-900); }
  .stock-row-name .stock-code{ color:var(--text-400); font-weight:700; font-size:11.5px; margin-left:8px; }
  .stock-row-meta{ font-size:11.5px; color:var(--text-400); margin-top:3px; }
  .stock-row-nums{ display:flex; gap:26px; flex:none; }
  .stock-num{ text-align:right; min-width:60px; }
  .stock-num-val{ font-size:13.5px; font-weight:800; font-variant-numeric:tabular-nums; }
  .stock-num-label{ font-size:10.5px; color:var(--text-400); margin-top:2px; }
  @media (max-width: 1000px){
    .stock-row{ flex-wrap:wrap; }
    .stock-row-nums{ gap:16px; }
  }

  .table-footer{ display:flex; justify-content:space-between; align-items:center; padding:10px 4px 0; font-size:12px; color:var(--text-400); flex-wrap:wrap; gap:8px; }
  .usage-summary-row td{ background:var(--sub-bg); font-weight:800; color:var(--text-600); font-size:11.5px; border-bottom:1px solid var(--border-strong); }

  .report-grid{ display:grid; grid-template-columns:1.4fr 1fr; gap:14px; align-items:start; }

  .bar.in{ background:var(--blue-600); }

<script>
(function(){
  "use strict";

  /* ================= constants & seed data ================= */
  var WHS_DEFAULT = ["1공장창고","2공장창고","3공장창고","공통자재창고"];
  var CATS = [];
  var MAT_TYPES = [
    { name:"원자재", purchasable:false },
    { name:"부자재", purchasable:false },
    { name:"소모품", purchasable:true },
    { name:"기타", purchasable:true }
  ];
  function cloneMatTypes(){ return MAT_TYPES.map(function(t){ return { name:t.name, purchasable:t.purchasable }; }); }
  // 구매마스터는 정식 자재관리(품목관리)와 별개입니다: 현장에서 그때그때 요청하는 자잘한 소모품/부자재를 다룹니다.
  var PM_CATS = ["소모품","포장재","안전용품","공구","기타"];
  var PM_CAT_PREFIX = { "소모품":"SM", "포장재":"PK", "안전용품":"SF", "공구":"TL", "기타":"ET" };
  var ISSUERS = ["강준상","김서인","박성진","이문규"];
  function formatToday(){
    var d = new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  var TODAY = formatToday();
  var STORE_KEY = "pd_plusdoor_inventory_v1";

  function seedMats(){
    return [];
  }


  function seedPm(){
    var rows = [
      { cat:"공구", name:"실리콘건(코킹건)", alias:"", vendor:"대한하드웨어", moq:5, price:8000, leadtime:2, status:"" },
      { cat:"소모품", name:"양면테이프 50mm", alias:"", vendor:"삼진자재", moq:20, price:2500, leadtime:2, status:"" },
      { cat:"소모품", name:"케이블타이(대)", alias:"", vendor:"삼진자재", moq:50, price:3000, leadtime:2, status:"" },
      { cat:"포장재", name:"보양비닐(현장양생용)", alias:"", vendor:"필름월드", moq:10, price:12000, leadtime:3, status:"발주필요" },
      { cat:"포장재", name:"스티로폼 모서리보호재", alias:"", vendor:"우성보드산업", moq:30, price:900, leadtime:3, status:"" },
      { cat:"안전용품", name:"현장용 목장갑", alias:"", vendor:"대한하드웨어", moq:20, price:1500, leadtime:2, status:"발주완료", completedAt:"2026-07-09" },
      { cat:"소모품", name:"여분 볼트/너트 세트(M6)", alias:"", vendor:"대현하드웨어", moq:10, price:4000, leadtime:4, status:"" },
      { cat:"소모품", name:"청소용 극세사타월", alias:"", vendor:"삼진자재", moq:20, price:1800, leadtime:2, status:"" }
    ];
    var counters = {};
    return rows.map(function(r,i){
      var prefix = PM_CAT_PREFIX[r.cat] || "ET";
      counters[prefix] = (counters[prefix]||0)+1;
      var code = prefix+"-"+String(counters[prefix]).padStart(3,"0");
      return Object.assign({ id:"PM-"+(1000+i), code:code, contact:"", buy:"전화", memo:"", photo:"" }, r);
    });
  }

  function seedLogs(){
    return [];
  }

  function seedInLogs(){
    return [];
  }

  function seedAlerts(){
    return [
      { date:"2026-07-09", time:"09:00", wh:"2공장창고", code:"M-1005", name:"디지털 도어락 A형", stock:22, safe:40, lack:18 },
      { date:"2026-07-01", time:"09:00", wh:"3공장창고", code:"M-1008", name:"PET필름 그레이", stock:14, safe:25, lack:11 },
      { date:"2026-06-25", time:"09:00", wh:"1공장창고", code:"M-1001", name:"스텐 경첩 4인치", stock:145, safe:180, lack:35 }
    ];
  }

  function seedState(){
    return {
      whs: WHS_DEFAULT.slice(),
      cats: CATS.slice(),
      matTypes: cloneMatTypes(),
      mats: seedMats(),
      pm: seedPm(),
      logs: seedLogs(),
      inLogs: seedInLogs(),
      stocktakeLogs: [],
      alerts: seedAlerts(),
      safety: { mode:"auto", peakMonths:[3,4,5,9,10] },
      cur:"dashboard", materialTab:"register", stockTab:"status", stockWh:"all", posWh:"all", posQ:"", receiveWh:"all", receiveQ:"", stocktakeWh:"all", stocktakeMode:"wh", stocktakeQ:"",
      stockAsOf: TODAY, stockFrom: addDays(TODAY,-29), stockTo: TODAY,
      historyFrom: addDays(TODAY,-29), historyTo: TODAY,
      usageFrom: addDays(TODAY,-29), usageTo: TODAY, usageWhs: null, usageType: "all", usageQuery: "", usageSortKey: "code", usageSortDir: "asc",
      monthlyYear: parseInt(TODAY.slice(0,4),10), monthlyWh: "all", monthlyType: "all", monthlyQ: "",
      yoyMonth: parseInt(TODAY.slice(5,7),10), yoyWh: "all", yoyType: "all", yoyQ: "",
      purchaseTab: "request", pmReqQuery: "", pmGuideQuery: "", pmGuideSelKind: "type", pmGuideSelValue: "all",
      cart:[], inCart:[]
    };
  }

  function load(){
    try{
      var raw = localStorage.getItem(STORE_KEY);
      if(!raw) return seedState();
      var s = JSON.parse(raw);
      if(!s) return seedState();
      s.cart = s.cart || []; s.inCart = s.inCart || [];
      s.whs = s.whs || WHS_DEFAULT.slice();
      s.cats = (typeof s.cats !== 'undefined') ? s.cats : CATS.slice();
      s.matTypes = (typeof s.matTypes !== 'undefined') ? s.matTypes : cloneMatTypes();
      // 예전 버전에서는 자재구분이 문자열 배열이었습니다. 객체 배열로 자동 변환합니다.
      s.matTypes = s.matTypes.map(function(t){
        if(typeof t === "string") return { name:t, purchasable:(t==="소모품"||t==="기타") };
        return t;
      });
      s.stockAsOf = s.stockAsOf || TODAY;
      s.stockFrom = s.stockFrom || addDays(TODAY,-29);
      s.stockTo = s.stockTo || TODAY;
      s.historyFrom = s.historyFrom || addDays(TODAY,-29);
      s.historyTo = s.historyTo || TODAY;
      s.stockWh = s.stockWh || "all";
      s.stocktakeWh = s.stocktakeWh || "all";
      s.stocktakeMode = s.stocktakeMode || "wh";
      s.stocktakeQ = s.stocktakeQ || "";
      s.stocktakeLogs = s.stocktakeLogs || [];
      s.usageType = s.usageType || "all";
      s.usageFrom = s.usageFrom || addDays(TODAY,-29);
      s.usageTo = s.usageTo || TODAY;
      s.usageWhs = s.usageWhs || null;
      s.usageQuery = s.usageQuery || "";
      s.usageSortKey = s.usageSortKey || "code";
      s.usageSortDir = s.usageSortDir || "asc";
      s.purchaseTab = s.purchaseTab || "request";
      s.pmReqQuery = s.pmReqQuery || "";
      s.pmGuideQuery = s.pmGuideQuery || "";
      s.pmGuideSelKind = s.pmGuideSelKind || "type";
      s.pmGuideSelValue = s.pmGuideSelValue || "all";
      s.monthlyYear = s.monthlyYear || parseInt(TODAY.slice(0,4),10);
      s.monthlyWh = s.monthlyWh || "all";
      s.monthlyType = s.monthlyType || "all";
      s.monthlyQ = s.monthlyQ || "";
      s.yoyMonth = s.yoyMonth || parseInt(TODAY.slice(5,7),10);

  function stockLevel4(stockVal, safeVal){

  }
  function daysBetweenInclusive(start, end){

  window.posSetWh = function(w){ APP.posWh=w; renderContent(); };
  window.posSetQ = function(v){ APP.posQ=v; renderContent(); var el=document.querySelector('.search-input-lg'); if(el){ el.focus(); el.setSelectionRange(el.value.length, el.value.length); } };
  window.posAdd = function(code){
    var m = byCode(code); if(!m) return;
    var line = APP.cart.filter(function(c){ return c.code===code; })[0];
    if(line) line.qty += 1; else APP.cart.push({ code:code, name:m.name, wh:m.wh, unit:m.unit, qty:1 });
    persist(); renderContent();
  };
  window.posQty = function(code, d){
    var line = APP.cart.filter(function(c){ return c.code===code; })[0]; if(!line) return;
    line.qty += d;
    if(line.qty<=0) APP.cart = APP.cart.filter(function(c){ return c.code!==code; });
    persist(); renderContent();
  };
  window.posSetQty = function(code, v){
    var n = parseInt(v,10);
    if(!n || n<=0) APP.cart = APP.cart.filter(function(c){ return c.code!==code; });
    else { var line=APP.cart.filter(function(c){ return c.code===code; })[0]; if(line) line.qty=n; }
    persist(); renderContent();
  };
  window.posRemove = function(code){ APP.cart = APP.cart.filter(function(c){ return c.code!==code; }); persist(); renderContent(); };
  window.posClear = function(){ if(!APP.cart.length) return; confirmAction("출고목록을 모두 비울까요?", function(){ APP.cart=[]; persist(); renderContent(); }); };
  window.posIssue = function(){
    if(APP.cart.length===0) return;
    var issuer = (document.getElementById("posIssuer")||{}).value || ISSUERS[0];
    var note = (document.getElementById("posNote")||{}).value || "-";
    var newlyLow = [];
    var batchId = newId("BATCH");
    var actionTime = nowTimeStr();
    APP.cart.forEach(function(item){
      var m = byCode(item.code); if(!m) return;
      var wasLow = isLow(m);
      APP.logs.unshift({ id:newId("LOG"), batchId:batchId, date:TODAY, time:actionTime, wh:m.wh, code:m.code, name:m.name, qty:item.qty, unit:m.unit, order:"-", worker:issuer, memo:note });
      m.stock = Math.max(0, m.stock - item.qty);
      if(!wasLow && isLow(m)){
        newlyLow.push(m);
        APP.alerts.unshift({ date:TODAY, time:"now", wh:m.wh, code:m.code, name:m.name, stock:m.stock, safe:activeSafe(m), lack:activeSafe(m)-m.stock });
      }
    });
    APP.cart = [];
    persist();
    renderContent();
    if(newlyLow.length){
      showToast("출고 처리 완료. 다만 "+newlyLow.map(function(m){return m.name;}).join(", ")+" 품목이 안전재고 미달로 전환되었습니다.");
    } else {
      showToast("출고 처리가 완료되었습니다. 재고와 입출고내역에 반영되었습니다.");
    }
  };

  function computeUsageAnalysis(){
    var start = APP.usageFrom || addDays(TODAY,-29), end = APP.usageTo || TODAY;
    if(start > end){ var t0=start; start=end; end=t0; }
    var days = daysBetweenInclusive(start,end);
    var whSel = APP.usageWhs;
    var type = APP.usageType || "all";
    var q = (APP.usageQuery||"").trim().toLowerCase();
    var items = APP.mats.filter(function(m){
      if(isPurchasableType(m.matType)) return false;
      var okWh = !whSel || whSel.length===0 || whSel.indexOf(m.wh)>-1;
      var okType = type==="all" || m.matType===type;
      var okQ = !q || m.name.toLowerCase().indexOf(q)>-1 || m.code.toLowerCase().indexOf(q)>-1 ||
        (m.cat||"").toLowerCase().indexOf(q)>-1 || (m.matType||"").toLowerCase().indexOf(q)>-1 || (m.loc||"").toLowerCase().indexOf(q)>-1;
      return okWh && okType && okQ;
    }).map(function(m){
      var inQty = periodIn(m,start,end);
      var outQty = periodOut(m,start,end);
      var opening = stockAsOfQty(m, prevDay(start));
      var closing = stockAsOfQty(m, end);
      var avgStock = Math.round(((opening+closing)/2)*100)/100;
      var dailyUsage = outQty/days;
      var daysLeft = dailyUsage>0 ? Math.round(m.stock/dailyUsage) : null;
      return { m:m, current:m.stock, avg:avgStock, daysLeft:daysLeft, inQty:inQty, outQty:outQty, safe:activeSafe(m) };
    });
    var key = APP.usageSortKey||"code", dir = (APP.usageSortDir==="desc") ? -1 : 1;
    items.sort(function(a,b){
      var av,bv;
      if(key==="code"){ av=a.m.code; bv=b.m.code; if(av<bv) return -1*dir; if(av>bv) return 1*dir; return 0; }
      else if(key==="current"){ av=a.current; bv=b.current; }
      else if(key==="avg"){ av=a.avg; bv=b.avg; }
      else if(key==="daysLeft"){ av=a.daysLeft==null?Infinity:a.daysLeft; bv=b.daysLeft==null?Infinity:b.daysLeft; }
      else if(key==="in"){ av=a.inQty; bv=b.inQty; }
      else if(key==="out"){ av=a.outQty; bv=b.outQty; }
      else if(key==="safe"){ av=a.safe; bv=b.safe; }
      else { av=a.m.code; bv=b.m.code; }
      return (av-bv)*dir;
    });
    var agg = { sumCurrent:0, sumAvg:0, sumIn:0, sumOut:0, avgDaysLeft:null };
    var dSum=0, dCnt=0;
    items.forEach(function(x){ agg.sumCurrent+=x.current; agg.sumAvg+=x.avg; agg.sumIn+=x.inQty; agg.sumOut+=x.outQty; if(x.daysLeft!=null){ dSum+=x.daysLeft; dCnt++; } });
    agg.avgDaysLeft = dCnt ? Math.round((dSum/dCnt)*100)/100 : null;
    return { start:start, end:end, days:days, items:items, agg:agg };
  }

  function hashNum(str){ var h=0; for(var i=0;i<str.length;i++){ h=(h*31+str.charCodeAt(i))|0; } return Math.abs(h); }
  function monthRange(year, month){
    var mm=(month<10?"0":"")+month;
    var start=year+"-"+mm+"-01";
    var lastDay=new Date(year, month, 0).getDate();
    var end=year+"-"+mm+"-"+(lastDay<10?"0":"")+lastDay;
    return { start:start, end:end };
  }
  function monthlyUsageFor(m, year, month){
    var curYear = parseInt(TODAY.slice(0,4),10);
    var curMonth = parseInt(TODAY.slice(5,7),10);
    var range = monthRange(year, month);
    if(year<curYear || (year===curYear && month<curMonth)) return periodOut(m, range.start, range.end);
    if(year===curYear && month===curMonth) return periodOut(m, range.start, TODAY);
    var base = (m.usage && (m.usage.lm||m.usage.cm)) || 10;
    var seed = hashNum(m.code+"-"+year+"-"+month);
    var variance = (seed%36)-14;
    return Math.max(0, Math.round(base + base*variance/100));
  }
  function computeMonthlyMatrix(){
    var wh = APP.monthlyWh || "all";
    var type = APP.monthlyType || "all";
    var q = (APP.monthlyQ||"").trim().toLowerCase();
    var year = APP.monthlyYear || parseInt(TODAY.slice(0,4),10);

  function computeYearlySameMonthMatrix(){
    var month = APP.yoyMonth || parseInt(TODAY.slice(5,7),10);
    var wh = APP.yoyWh || "all";
    var type = APP.yoyType || "all";
    var q = (APP.yoyQ||"").trim().toLowerCase();
    var yRange = monthlyYearRange();
    var years = [];
    for(var y=yRange.min;y<=yRange.max;y++){ years.push(y); }
    var curYear = parseInt(TODAY.slice(0,4),10);
    var curYearIdx = years.indexOf(curYear);
    var prevYearIdx = years.indexOf(curYear-1);
    var items = APP.mats.filter(function(m){
      if(isPurchasableType(m.matType)) return false;
      var okWh = wh==="all" || m.wh===wh;
      var okType = type==="all" || m.matType===type;
      var okQ = !q || m.name.toLowerCase().indexOf(q)>-1 || m.code.toLowerCase().indexOf(q)>-1 ||
        (m.cat||"").toLowerCase().indexOf(q)>-1 || (m.loc||"").toLowerCase().indexOf(q)>-1;
      return okWh && okType && okQ;
    }).map(function(m){
      var values = years.map(function(y){ return monthlyUsageFor(m,y,month); });
      var total = values.reduce(function(s,v){ return s+v; },0);
      var max = Math.max.apply(null, values);
      var yoyDiff = (curYearIdx>-1 && prevYearIdx>-1) ? values[curYearIdx]-values[prevYearIdx] : null;
      return { m:m, values:values, total:total, max:max, yoyDiff:yoyDiff };
    });
    items.sort(function(a,b){ return b.total-a.total; });
    return { month:month, years:years, items:items };
  }

  window.matPhotoUpload = function(input, code){

  window.bulkPhotoUpload = function(input){
    var files = Array.prototype.slice.call(input.files||[]);
    if(!files.length) return;
    var matched=0, unmatched=[];
    var pending = files.length;
    files.forEach(function(file){
      var key = file.name.replace(/\.[^.]+$/,"").toLowerCase();
      var m = APP.mats.filter(function(x){ return x.code.toLowerCase()===key; })[0] ||
              APP.mats.filter(function(x){ return x.name.toLowerCase()===key; })[0] ||
              APP.mats.filter(function(x){ return x.name.toLowerCase().indexOf(key)>-1 || key.indexOf(x.name.toLowerCase())>-1; })[0];
      if(!m){ unmatched.push(file.name); pending--; if(pending===0) finishBulk(); return; }
      resizeImageFile(file, function(dataUrl){ m.photo = dataUrl; matched++; pending--; if(pending===0) finishBulk(); });
    });
    function finishBulk(){
      persist(); renderContent();
      showToast("사진 일괄등록: "+matched+"건 매칭 완료"+(unmatched.length? ", 미매칭 "+unmatched.length+"건 ("+unmatched.join(", ")+")" : ""));
    }
  };
  function resizeImageFile(file, cb){
    var reader = new FileReader();
    reader.onload = function(e){
      var img = new Image();
      img.onload = function(){
        var maxDim = 320;
        var scale = Math.min(1, maxDim/Math.max(img.width,img.height));
        var w = Math.round(img.width*scale), h = Math.round(img.height*scale);
        var canvas = document.createElement("canvas");
        canvas.width=w; canvas.height=h;
        canvas.getContext("2d").drawImage(img,0,0,w,h);
        try{ cb(canvas.toDataURL("image/jpeg",0.8)); }catch(err){ cb(e.target.result); }
      };
      img.onerror = function(){ cb(e.target.result); };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  window.csvExport = function(){
    var header = ["코드","자재명","카테고리","자재구분","창고","단위","위치","현재고","비수기안전재고","성수기안전재고"];
    var lines = [header.join(",")].concat(APP.mats.map(function(m){
      return [m.code,m.name,m.cat,(m.matType||""),m.wh,m.unit,m.loc,m.stock,m.safeOff,m.safePeak].join(",");
    }));
    var csv = "﻿"+lines.join("\r\n");
    try{
      var blob = new Blob([csv], {type:"text/csv;charset=utf-8;"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url; a.download = "materials.csv"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("CSV 파일을 다운로드했습니다.");
    }catch(e){ showToast("이 환경에서는 다운로드가 제한됩니다. (프로토타입)"); }
  };
  window.csvImport = function(input){
    var file = input.files && input.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var text = String(e.target.result).replace(/^﻿/,"");
      var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
      if(lines.length<2){ showToast("가져올 데이터가 없습니다."); return; }
      var upserted = 0;
      for(var i=1;i<lines.length;i++){
        var cols = lines[i].split(",");
        if(cols.length<10) continue;
        var code=cols[0].trim();
        var rec = { code:code, name:cols[1].trim(), cat:cols[2].trim(), matType:cols[3].trim(), wh:cols[4].trim(), unit:cols[5].trim(), loc:cols[6].trim(), stock:parseInt(cols[7],10)||0, safeOff:parseInt(cols[8],10)||0, safePeak:parseInt(cols[9],10)||0 };
        var ex = byCode(code);
        if(ex){ Object.assign(ex, rec); } else { APP.mats.push(Object.assign({ factor:0, op:"*", photo:"", usage:{cm:0,lm:0,ly:0} }, rec)); }
        upserted++;
      }
      persist(); renderContent();
      showToast(upserted+"건의 자재 정보가 반영되었습니다.");
    };
    reader.readAsText(file, "utf-8");
  };

  window.renderPmReqModalPreview = function(code){
    var m = byCode(code); if(!m) return;
    var box = document.getElementById("req-modal-preview");
    if(!box || box.tagName === "TEXTAREA") return; // 직접 수정 중에는 자동 생성으로 덮어쓰지 않음
    var qty = parseInt((document.getElementById("req-qty")||{}).value,10) || 0;

  window.togglePmReqEdit = function(code){
    var box = document.getElementById("req-modal-preview");
    var btn = document.getElementById("req-edit-toggle");
    if(!box || !btn) return;
    if(box.tagName === "DIV"){
      var ta = document.createElement("textarea");
      ta.id = "req-modal-preview";
      ta.className = "req-box";
      ta.style.width = "100%";
      ta.style.resize = "vertical";
      ta.value = box.textContent;
      box.replaceWith(ta);
      ta.focus();
      btn.textContent = "자동생성으로 되돌리기";
    } else {
      var div = document.createElement("div");
      div.id = "req-modal-preview";
      div.className = "req-box";
      box.replaceWith(div);
      btn.textContent = "직접 수정";
      renderPmReqModalPreview(code);
    }

      navigator.clipboard.writeText(text).then(function(){ showToast("요청문이 클립보드에 복사되었습니다."); }, function(){ showToast("복사에 실패했습니다. 텍스트를 직접 선택해 복사해주세요."); });

  function historyRows(){
    return APP.logs.map(function(l,i){ return {type:"out", d:l, idx:i}; }).concat(APP.inLogs.map(function(l,i){ return {type:"in", d:l, idx:i}; }))
      .sort(function(a,b){ return a.d.date < b.d.date ? 1 : a.d.date > b.d.date ? -1 : 0; });
  }
  function historyGroups(start, end){
    var map = {}, order = [];
    function addAll(arr, type){
      arr.forEach(function(l){
        var m = byCode(l.code);
        if(m && isPurchasableType(m.matType)) return; // 구매마스터 표시 대상 자재는 입출고내역에 노출하지 않음
        if(start && l.date<start) return;
        if(end && l.date>end) return;
        var key = type+":"+(l.batchId || l.id);
        if(!map[key]){
          map[key] = { type:type, batchId:l.batchId||l.id, date:l.date, time:l.time, wh:l.wh, person:(type==="in"?l.receiver:l.worker), memo:l.memo, items:[] };
          order.push(key);
        }
        map[key].items.push(l);
      });
    }
    addAll(APP.logs, "out");
    addAll(APP.inLogs, "in");
    return order.map(function(k){ return map[k]; }).sort(function(a,b){
      if(a.date!==b.date) return a.date<b.date?1:-1;
      return (a.time<b.time)?1:(a.time>b.time?-1:0);
    });
  }

  window.saveBatchItem = function(type, id){
    var arr = type==="in" ? APP.inLogs : APP.logs;
    var l = arr.filter(function(x){ return x.id===id; })[0]; if(!l) return;
    var newQty = parseInt((document.getElementById("batch-qty-"+id)||{}).value, 10);
    if(!newQty || newQty<=0){ showToast("올바른 수량을 입력하세요."); return; }

    var m = byCode(l.code);
    if(m){
      var delta = type==="in" ? (newQty - oldQty) : (oldQty - newQty);
      m.stock = Math.max(0, m.stock + delta);
    }
    l.qty = newQty;
    persist();
    showToast("수량이 "+fmt(oldQty)+" → "+fmt(newQty)+"(으)로 수정되었습니다."+(m?" 재고에도 반영했습니다.":""));

  window.deleteBatchItem = function(type, id, batchId){
    var arr = type==="in" ? APP.inLogs : APP.logs;

    confirmAction((type==="in"?"입고":"출고")+" 내역 \""+l.name+" "+fmt(l.qty)+"\"을(를) 삭제할까요? 품목을 잘못 선택한 경우처럼 이 내역 자체가 잘못된 경우에만 사용하세요.", function(){

  function parseCsvLine(line){
    var result = [];
    var cur = "";
    var inQuotes = false;
    for(var i=0;i<line.length;i++){
      var ch = line[i];
      if(inQuotes){
        if(ch === '"'){
          if(line[i+1] === '"'){ cur += '"'; i++; }
          else { inQuotes = false; }
        } else { cur += ch; }
      } else {
        if(ch === '"'){ inQuotes = true; }
        else if(ch === ','){ result.push(cur); cur = ""; }
        else { cur += ch; }
      }
    }
    result.push(cur);
    return result;
  }
  var pendingHistoryImport = null;
  window.historyCsvImport = function(input){
    var file = input.files && input.files[0];
    input.value = "";
    if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      var text = String(e.target.result).replace(/^﻿/,"");
      var lines = text.split(/\r?\n/).filter(function(l){ return l.trim(); });
      if(lines.length<2){ showToast("가져올 데이터가 없습니다."); return; }
      var rows = [];
      for(var i=1;i<lines.length;i++){
        var cols = parseCsvLine(lines[i]);
        var lineNo = i+1;
        if(cols.length<7){ rows.push({ lineNo:lineNo, raw:lines[i], ok:false, reason:"열 개수 부족(7개 필요, "+cols.length+"개 입력됨)" }); continue; }
        var date = cols[0].trim();
        var type = cols[1].trim();
        var name = cols[2].trim();
        var qtyRaw = cols[3].trim();
        var qty = parseInt(qtyRaw,10);
        var wh = cols[4].trim() || "-";
        var worker = cols[5].trim() || "-";
        var memo = cols[6].trim() || "-";
        var reasons = [];
        if(!date) reasons.push("일자 누락");
        if(!name) reasons.push("자재명 누락");
        if(!qtyRaw || isNaN(qty) || qty<=0) reasons.push("수량 형식 오류(\""+qtyRaw+"\")");
        if(type!=="입고" && type!=="출고") reasons.push("구분 값 오류(\""+type+"\", 입고/출고만 가능)");
        if(reasons.length){ rows.push({ lineNo:lineNo, raw:lines[i], ok:false, reason:reasons.join(", ") }); continue; }
        var mat = APP.mats.filter(function(m){ return m.name===name; })[0];
        rows.push({ lineNo:lineNo, ok:true, date:date, type:type, name:name, qty:qty, wh:wh, worker:worker, memo:memo, isNewMat:!mat });
      }
      pendingHistoryImport = { rows:rows, fileName:file.name };
      openHistoryImportPreview();
    };
    reader.readAsText(file, "utf-8");
  };

      if(r.type==="입고"){
        APP.inLogs.push({ id:newId("INLOG"), batchId:newId("IBATCH"), date:r.date, time:"-", wh:r.wh, code:code, name:r.name, qty:r.qty, unit:unit, vendor:"-", receiver:r.worker, memo:r.memo });
        okIn++;
      } else {
        APP.logs.push({ id:newId("LOG"), batchId:newId("BATCH"), date:r.date, time:"-", wh:r.wh, code:code, name:r.name, qty:r.qty, unit:unit, order:"-", worker:r.worker, memo:r.memo });
        okOut++;
      }
    });
    var invalidCount = data.rows.length - valid.length;
    pendingHistoryImport = null;
    persist(); closeModal(); renderContent();
    showToast("이전 내역 업로드 완료: 입고 "+okIn+"건, 출고 "+okOut+"건"+(invalidCount?", 형식 오류로 제외 "+invalidCount+"건":"")+(newMatCount?" · 자재관리에 없는 자재 "+newMatCount+"종은 사용중지 자재로 자동 등록되어 이력에 연결했습니다(월별 사용량비교에서 확인 가능)":""));
  };

  /* ---------------- 설정(관리자) ---------------- */
  function screenAdmin(){
    var whRows = APP.whs.map(function(w,i){
      var cnt = APP.mats.filter(function(m){ return m.wh===w; }).length;
      return '<div class="wh-row"><div class="wh-order-btns"><button onclick="whMove('+i+',-1)">▲</button><button onclick="whMove('+i+',1)">▼</button></div>'+
        '<input class="input wh-name-input" type="text" value="'+esc(w)+'" onchange="whRename('+i+', this.value)">'+
        '<span class="muted" style="font-size:12px;color:var(--text-400);white-space:nowrap">등록 품목 '+cnt+'건</span>'+
        '<button class="btn btn-outline icon-only" onclick="whDelete('+i+')"><svg class="ic" style="width:14px;height:14px"><use href="#i-trash"/></svg></button></div>';
    }).join("");

    var catRows = APP.cats.map(function(c,i){
      var cnt = APP.mats.filter(function(m){ return m.cat===c; }).length;
      return '<div class="wh-row"><div class="wh-order-btns"><button onclick="catMove('+i+',-1)">▲</button><button onclick="catMove('+i+',1)">▼</button></div>'+
        '<input class="input wh-name-input" type="text" value="'+esc(c)+'" onchange="catRename('+i+', this.value)">'+
        '<span class="muted" style="font-size:12px;color:var(--text-400);white-space:nowrap">등록 품목 '+cnt+'건</span>'+
        '<button class="btn btn-outline icon-only" onclick="catDelete('+i+')"><svg class="ic" style="width:14px;height:14px"><use href="#i-trash"/></svg></button></div>';
    }).join("");

    var typeRows = APP.matTypes.map(function(t,i){
      var cnt = APP.mats.filter(function(m){ return m.matType===t.name; }).length;
      return '<div class="wh-row" style="flex-wrap:wrap"><div class="wh-order-btns"><button onclick="typeMove('+i+',-1)">▲</button><button onclick="typeMove('+i+',1)">▼</button></div>'+
        '<input class="input wh-name-input" type="text" value="'+esc(t.name)+'" onchange="typeRename('+i+', this.value)">'+
        '<label style="display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-600);white-space:nowrap;cursor:pointer" title="체크하면 이 자재구분의 품목이 구매마스터(자재 요청·발주진행도)에 표시됩니다"><input type="checkbox" '+(t.purchasable?"checked":"")+' onchange="typeTogglePurchasable('+i+', this.checked)">구매마스터 표시</label>'+
        '<span class="muted" style="font-size:12px;color:var(--text-400);white-space:nowrap">등록 품목 '+cnt+'건</span>'+
        '<button class="btn btn-outline icon-only" onclick="typeDelete('+i+')"><svg class="ic" style="width:14px;height:14px"><use href="#i-trash"/></svg></button></div>';
    }).join("");

    var months = ["1월","2월","3월","4월","5월","6월","7월","8월","9월","10월","11월","12월"];
    var seasonGrid = months.map(function(mLabel, idx){
      var mo = idx+1;
      var active = APP.safety.peakMonths.indexOf(mo) > -1;
      return '<button class="season-cell'+(active?" active":"")+'" '+(APP.safety.mode!=="auto"?"disabled":"")+' onclick="toggleSeasonMonth('+mo+')">'+mLabel+'</button>';
    }).join("");

    return '<div class="sub-view">'+
      '<div class="grid-3">'+
        '<div class="panel"><div class="panel-header"><h3>창고 관리</h3></div><div class="panel-body pad">'+
          '<div class="field" style="margin-bottom:10px"><label>신규 창고 추가</label><div style="display:flex;gap:8px;margin-top:6px"><input type="text" id="new-wh-name" placeholder="창고명 입력" style="flex:1"><button class="btn btn-primary" onclick="whAdd()">추가</button></div></div>'+
          '<div style="max-height:320px;overflow-y:auto">'+whRows+'</div>'+
        '</div></div>'+
        '<div class="panel"><div class="panel-header"><h3>자재 구분 관리</h3></div><div class="panel-body pad">'+
          '<div class="field" style="margin-bottom:10px"><label>신규 자재 구분 추가</label><div style="display:flex;gap:8px;margin-top:6px;align-items:center"><input type="text" id="new-type-name" placeholder="예: 반제품" style="flex:1"><label style="display:flex;align-items:center;gap:4px;font-size:11.5px;color:var(--text-600);white-space:nowrap;cursor:pointer" title="체크하면 이 자재구분의 품목이 구매마스터(자재 요청·발주진행도)에 표시됩니다"><input type="checkbox" id="new-type-purchasable">구매마스터 표시</label><button class="btn btn-primary" onclick="typeAdd()">추가</button></div></div>'+
          '<div style="max-height:320px;overflow-y:auto">'+typeRows+'</div>'+
          '<div class="pos-hint" style="margin-top:10px">여기서 추가·수정한 항목이 자재 신규등록/수정 모달의 "자재 구분" 목록에 바로 반영됩니다.</div>'+
        '</div></div>'+
        '<div class="panel"><div class="panel-header"><h3>카테고리 관리</h3></div><div class="panel-body pad">'+
          '<div class="field" style="margin-bottom:10px"><label>신규 카테고리 추가</label><div style="display:flex;gap:8px;margin-top:6px"><input type="text" id="new-cat-name" placeholder="예: 실리콘" style="flex:1"><button class="btn btn-primary" onclick="catAdd()">추가</button></div></div>'+
          '<div style="max-height:320px;overflow-y:auto">'+catRows+'</div>'+
          '<div class="pos-hint" style="margin-top:10px">여기서 추가·수정한 항목이 자재 신규등록/수정 모달의 "카테고리" 목록에 바로 반영됩니다.</div>'+
        '</div></div>'+
      '</div>'+
      '<div class="panel"><div class="panel-header"><h3>안전재고 기준 설정</h3></div><div class="panel-body pad">'+
        '<div class="field" style="margin-bottom:12px"><label>적용 방식</label><div class="radio-row" style="margin-top:6px">'+
          ['auto','peak','off'].map(function(mode){
            var label = mode==="auto" ? "월별 자동 전환" : mode==="peak" ? "성수기 고정" : "비수기 고정";
            return '<label class="radio-opt'+(APP.safety.mode===mode?" checked-in":"")+'"><input type="radio" name="safety-mode" '+(APP.safety.mode===mode?"checked":"")+' onchange="setSafetyMode(\''+mode+'\')" style="display:none">'+label+'</label>';
          }).join("")+
        '</div></div>'+
        '<div class="field"><label>성수기 월 선택 (자동 전환 모드에서만 적용)</label><div class="season-grid" style="margin-top:8px">'+seasonGrid+'</div></div>'+
        '<div class="pos-hint" style="margin-top:10px">현재(2026-07) 적용 기준: <b>'+(APP.safety.mode==="auto" ? (APP.safety.peakMonths.indexOf(7)>-1?"성수기":"비수기") : (APP.safety.mode==="peak"?"성수기":"비수기"))+'</b></div>'+
      '</div></div>'+
      '<div class="panel"><div class="panel-header"><h3>데이터 백업 / 복원</h3></div><div class="panel-body pad">'+
        '<div class="stat-cards cols-3" style="margin-bottom:14px">'+
          '<div class="stat-card"><div class="stat-label">등록 자재</div><div class="stat-value">'+APP.mats.length+'</div></div>'+
          '<div class="stat-card"><div class="stat-label">기록 건수</div><div class="stat-value">'+(APP.logs.length+APP.inLogs.length+APP.stocktakeLogs.length)+'</div></div>'+
          '<div class="stat-card"><div class="stat-label">소모품 자재</div><div class="stat-value">'+consumableMats().length+'</div></div>'+
        '</div>'+
        '<div class="backup-grid">'+
          '<button class="btn btn-primary" style="height:44px" onclick="downloadBackup()"><svg class="ic"><use href="#i-download"/></svg>백업 파일 다운로드</button>'+
          '<label class="btn btn-outline" style="height:44px;justify-content:center"><input type="file" accept=".json" style="display:none" onchange="restoreBackup(this)"><svg class="ic"><use href="#i-upload"/></svg>백업 파일 선택하여 복원</label>'+
        '</div>'+
      '</div></div>'+
    '</div>';
  }
  window.whAdd = function(){
    var el = document.getElementById("new-wh-name"); var v = el.value.trim();
    if(!v) return; if(APP.whs.indexOf(v)>-1){ showToast("이미 존재하는 창고명입니다."); return; }
    APP.whs.push(v); persist(); renderContent(); showToast("창고가 추가되었습니다.");
  };
  window.whRename = function(i, v){ v=v.trim(); if(!v) return; var old=APP.whs[i]; APP.whs[i]=v; APP.mats.forEach(function(m){ if(m.wh===old) m.wh=v; }); persist(); renderContent(); showToast("창고명이 변경되었습니다."); };
  window.whMove = function(i, dir){ var j=i+dir; if(j<0||j>=APP.whs.length) return; var t=APP.whs[i]; APP.whs[i]=APP.whs[j]; APP.whs[j]=t; persist(); renderContent(); };
  window.whDelete = function(i){
    var w = APP.whs[i];
    if(APP.mats.some(function(m){ return m.wh===w; })){ showToast("해당 창고에 등록된 자재가 있어 삭제할 수 없습니다."); return; }
    confirmAction(w+" 창고를 삭제할까요?", function(){
      APP.whs.splice(i,1); persist(); renderContent();
    });
  };
  window.catAdd = function(){
    var el = document.getElementById("new-cat-name"); var v = el.value.trim();
    if(!v) return; if(APP.cats.indexOf(v)>-1){ showToast("이미 존재하는 카테고리명입니다."); return; }
    APP.cats.push(v); persist(); renderContent(); showToast("카테고리가 추가되었습니다.");
  };
  window.catRename = function(i, v){ v=v.trim(); if(!v) return; var old=APP.cats[i]; APP.cats[i]=v; APP.mats.forEach(function(m){ if(m.cat===old) m.cat=v; }); persist(); renderContent(); showToast("카테고리명이 변경되었습니다."); };
  window.catMove = function(i, dir){ var j=i+dir; if(j<0||j>=APP.cats.length) return; var t=APP.cats[i]; APP.cats[i]=APP.cats[j]; APP.cats[j]=t; persist(); renderContent(); };
  window.catDelete = function(i){
    var c = APP.cats[i];
    if(APP.mats.some(function(m){ return m.cat===c; })){ showToast("해당 카테고리로 지정된 자재가 있어 삭제할 수 없습니다."); return; }
    confirmAction(c+" 카테고리를 삭제할까요?", function(){
      APP.cats.splice(i,1); persist(); renderContent();
    });
  };
  window.typeAdd = function(){
    var el = document.getElementById("new-type-name"); var v = el.value.trim();
    var purchasable = (document.getElementById("new-type-purchasable")||{}).checked || false;
    if(!v) return; if(APP.matTypes.some(function(t){ return t.name===v; })){ showToast("이미 존재하는 자재 구분입니다."); return; }
    APP.matTypes.push({ name:v, purchasable:purchasable }); persist(); renderContent(); showToast("자재 구분이 추가되었습니다.");
  };
  window.typeRename = function(i, v){ v=v.trim(); if(!v) return; var old=APP.matTypes[i].name; APP.matTypes[i].name=v; APP.mats.forEach(function(m){ if(m.matType===old) m.matType=v; }); persist(); renderContent(); showToast("자재 구분명이 변경되었습니다."); };
  window.typeMove = function(i, dir){ var j=i+dir; if(j<0||j>=APP.matTypes.length) return; var t=APP.matTypes[i]; APP.matTypes[i]=APP.matTypes[j]; APP.matTypes[j]=t; persist(); renderContent(); };
  window.typeTogglePurchasable = function(i, checked){ APP.matTypes[i].purchasable = checked; persist(); renderContent(); };
  window.typeDelete = function(i){
    var t = APP.matTypes[i].name;
    if(APP.mats.some(function(m){ return m.matType===t; })){ showToast("해당 자재 구분으로 지정된 자재가 있어 삭제할 수 없습니다."); return; }
    confirmAction(t+"을(를) 삭제할까요?", function(){
      APP.matTypes.splice(i,1); persist(); renderContent();
    });
  };
  window.setSafetyMode = function(mode){
    var beforeLow = lowCodesSnapshot();
    APP.safety.mode = mode;
    logNewlyLow(beforeLow);
    persist(); renderContent();
  };
  window.toggleSeasonMonth = function(mo){
    if(APP.safety.mode!=="auto") return;
    var beforeLow = lowCodesSnapshot();
    var idx = APP.safety.peakMonths.indexOf(mo);
    if(idx>-1) APP.safety.peakMonths.splice(idx,1); else APP.safety.peakMonths.push(mo);
    logNewlyLow(beforeLow);
    persist(); renderContent();
  };
  window.downloadBackup = function(){
    var payload = { type:"plusdoor-inventory-backup", version:1, exportedAt:TODAY, data:APP };
    try{
      var blob = new Blob([JSON.stringify(payload,null,2)], {type:"application/json"});
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a"); a.href=url; a.download="plusdoor-inventory-backup.json"; document.body.appendChild(a); a.click(); document.body.removeChild(a);
      URL.revokeObjectURL(url);
      showToast("백업 파일을 다운로드했습니다.");
    }catch(e){ showToast("이 환경에서는 다운로드가 제한됩니다. (프로토타입)"); }
  };
  window.restoreBackup = function(input){
    var file = input.files && input.files[0]; if(!file) return;
    var reader = new FileReader();
    reader.onload = function(e){
      try{
        var payload = JSON.parse(e.target.result);
        if(!payload || payload.type!=="plusdoor-inventory-backup" || !payload.data){ showToast("올바른 백업 파일이 아닙니다."); return; }
        confirmAction("현재 데이터를 백업 파일 내용으로 덮어쓸까요?", function(){
          APP = payload.data;
          persist(); renderContent();
          showToast("백업 데이터를 복원했습니다.");
        });
      }catch(err){ showToast("파일을 읽는 중 오류가 발생했습니다."); }
    };
    reader.readAsText(file, "utf-8");
  };

  /* ================= screen registry & init ================= */
  var SCREENS = {
    dashboard: screenDashboard, pos: screenPos, receive: screenReceive, stock: screenStock,
    material: screenMaterial, purchase: screenPurchase,
    history: screenHistory, admin: screenAdmin
  };

  renderContent();
})();
</script>
